[project]
name = "settlement-ledger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.setuptools]
packages = ["app", "app.api", "app.rules", "app.store", "app.usecase"]
